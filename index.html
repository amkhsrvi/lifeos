<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeOS</title>
<style>
  body { font-family: Tahoma, sans-serif; margin: 0; padding: 20px;
         background: #f4f6fb; color: #1d2433; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 20px;
          margin: 16px auto; max-width: 420px;
          box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { margin-top: 0; }
  #date { font-size: 1.3em; font-weight: bold; }
  #time { font-size: 2em; margin-top: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>سلام! به LifeOS خوش آمدید 👋</h1>
    <div id="date"></div>
    <div id="time"></div>
  </div>
<script>
  function tick() {
    const now = new Date();
    document.getElementById('date').textContent =
      new Intl.DateTimeFormat('fa-IR-u-ca-persian',
        { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
    document.getElementById('time').textContent =
      new Intl.DateTimeFormat('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
