<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeOS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b6df0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --primary:#3b6df0; --danger:#d93f3f; --ok:#2a9d5c; --border:#e3e7f0; }
  * { box-sizing: border-box; }
  body { font-family: Tahoma, sans-serif; margin:0; background:var(--bg); color:var(--text); padding-bottom:30px; }
  header { background:var(--primary); color:#fff; padding:10px 16px; position:sticky; top:0; z-index:6; }
  header .d { font-weight:bold; font-size:1.1em; }
  header .t { font-size:.95em; opacity:.9; margin-top:2px; }
  main { padding:12px; max-width:560px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 5px rgba(0,0,0,.07); }
  .card h2 { margin:0 0 10px; font-size:1.05em; }
  .row { display:flex; gap:8px; align-items:center; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:var(--bg); border-radius:10px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:1.5em; }
  .stat span { color:var(--muted); font-size:.85em; }
  input, select, button, textarea { font-family:inherit; font-size:1em; }
  input[type=text], input[type=date], input[type=time], input[type=number], select { width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--text); margin-bottom:8px; }
  button { border:0; border-radius:10px; padding:10px 14px; cursor:pointer; background:var(--primary); color:#fff; }
  button.sec { background:var(--bg); color:var(--text); border:1px solid var(--border); }
  button.del { background:transparent; color:var(--danger); padding:6px 8px; }
  button.ed { background:transparent; color:var(--primary); padding:6px 8px; }
  .task { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .task:last-child { border-bottom:0; }
  .task input[type=checkbox] { width:22px; height:22px; flex:none; }
  .task .body { flex:1; min-width:0; }
  .task .title { word-break:break-word; }
  .task.done .title { text-decoration:line-through; color:var(--muted); }
  .meta { font-size:.8em; color:var(--muted); margin-top:2px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:20px; font-size:.75em; margin-inline-end:4px; }
  .p-high { background:#fde4e4; color:#b32626; }
  .p-mid { background:#fff1d6; color:#8a5a00; }
  .p-low { background:#e3f3ea; color:#1d7a46; }
  .k-task { background:#e8eefc; color:#2a4fb8; }
  .k-asg { background:#efe6fb; color:#6b35b0; }
  .k-exam { background:#fde4e4; color:#b32626; }
  .overdue { color:var(--danger); font-weight:bold; }
  .empty { color:var(--muted); text-align:center; padding:14px 0; }
  nav { position:fixed; bottom:0; right:0; left:0; background:#fff; border-top:1px solid var(--border); display:flex; z-index:5; }
  nav button { flex:1; background:transparent; color:var(--muted); border-radius:0; padding:12px 2px; font-size:.78em; }
  nav button.active { color:var(--primary); font-weight:bold; }
  .filters { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .filters button { padding:6px 12px; font-size:.85em; }
  .filters button.active { background:var(--primary); color:#fff; }
  .soon { color:var(--muted); text-align:center; padding:30px 10px; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .bar { height:6px; background:var(--border); border-radius:6px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--ok); }
  .chart { display:flex; gap:3px; align-items:flex-end; }
  .chart .col { flex:1; background:transparent; border:0; padding:2px 0; border-radius:8px; display:flex; flex-direction:column; align-items:center; color:var(--muted); min-width:0; }
  .chart .col.sel { background:#e8eefc; }
  .chart .num { font-size:.7em; height:14px; }
  .chart .stack { height:100px; width:60%; max-width:26px; display:flex; flex-direction:column; justify-content:flex-end; border-radius:4px; overflow:hidden; background:var(--bg); }
  .chart .stack i { display:block; width:100%; }
  .chart .w { background:var(--primary); }
  .chart .h { background:var(--ok); }
  .chart .lb { font-size:.65em; margin-top:3px; line-height:1.2; text-align:center; min-height:2.4em; }
  .hrow { display:flex; align-items:center; gap:12px; }
  #menuBtn { background:rgba(255,255,255,.2); padding:4px 12px; font-size:1.4em; line-height:1.2; border-radius:10px; }
  .vt { font-weight:bold; font-size:1.15em; }
  .sub { font-size:.82em; opacity:.95; margin-top:4px; }
  #drawer { display:none; position:fixed; top:0; right:0; bottom:0; left:0; z-index:30; }
  #drawer .bk { position:absolute; top:0; right:0; bottom:0; left:0; background:rgba(0,0,0,.4); }
  #drawer .dr { position:absolute; top:0; bottom:0; right:0; width:230px; background:#fff; padding:16px 8px; box-shadow:-2px 0 12px rgba(0,0,0,.2); }
  #drawer .dr button { display:block; width:100%; text-align:right; background:transparent; color:var(--text); padding:14px 12px; font-size:1.05em; border-radius:10px; }
  #drawer .dr button.cur { background:#e8eefc; color:var(--primary); font-weight:bold; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .grid .th { aspect-ratio:1; background:var(--bg); border-radius:8px; overflow:hidden; cursor:pointer; }
  .grid img { width:100%; height:100%; object-fit:cover; display:block; }
  #lb { display:none; position:fixed; top:0; right:0; bottom:0; left:0; z-index:40; background:rgba(0,0,0,.93); flex-direction:column; align-items:center; padding:10px; }
  #lb .bar2 { display:flex; gap:8px; margin-bottom:8px; }
  #lb .cap { color:#fff; margin-bottom:6px; font-size:.9em; }
  #lb img { max-width:100%; flex:1; min-height:0; object-fit:contain; }
  .tl { position:relative; margin-top:6px; }
  .tl .hr { position:absolute; right:0; left:0; height:52px; border-top:1px solid var(--border); cursor:pointer; }
  .tl .hr span { position:absolute; right:0; top:2px; font-size:.7em; color:var(--muted); width:46px; }
  .tl .tla { position:absolute; top:0; bottom:0; right:50px; left:4px; pointer-events:none; }
  .blk { position:absolute; pointer-events:auto; box-sizing:border-box; border-right:4px solid; border-radius:8px; padding:2px 6px; overflow:hidden; font-size:.78em; display:flex; flex-direction:column; cursor:pointer; }
  .blk b { font-weight:bold; } .blk small { color:var(--muted); }
  .blk.pl { border-style:dashed; border-width:1px 4px 1px 1px; }
  .blk.au { background:#f1f3f9; border-color:#9aa3b5; cursor:default; }
  .nowl { position:absolute; right:0; left:0; height:2px; background:var(--danger); z-index:3; pointer-events:none; }
  .week { display:flex; gap:6px; margin-top:6px; }
  .week div { text-align:center; font-size:.7em; color:var(--muted); width:22px; }
  .week b { display:block; font-size:1.3em; line-height:1.1; }
  .week .y { color:var(--ok); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips label { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:6px 12px; font-size:.85em; }
</style>
</head>
<body>
<header>
  <div class="hrow"><button id="menuBtn" onclick="openMenu()" aria-label="منو">☰</button><div class="vt" id="hd-title">داشبورد</div></div>
  <div class="sub"><span id="hd-date"></span> • <span id="hd-time"></span></div>
</header>
<div id="drawer"></div>
<div id="lb"></div>
<main id="app"></main>

<script>
/* ============ ذخیره‌سازی ============ */
const KEY = 'lifeos_data_v1';
let db = { tasks: [], subjects: [], assignments: [], exams: [], habits: [], blocks: [], notes: [] };
function load() {
  try { const r = localStorage.getItem(KEY); if (r) db = Object.assign(db, JSON.parse(r)); }
  catch (e) { console.error('خطا در خواندن داده', e); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('ذخیره‌سازی انجام نشد: ' + e.message); }
}

/* ============ ابزارهای تاریخ ============ */
const fa = (n) => new Intl.NumberFormat('fa-IR', { useGrouping:false }).format(n);
const pDate = (d, opt) => new Intl.DateTimeFormat('fa-IR-u-ca-persian', opt).format(d);
function todayStr() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}
function showDate(s) { return s ? pDate(new Date(s + 'T12:00:00'), { year:'numeric', month:'long', day:'numeric' }) : ''; }
function daysFromToday(s) {
  const a = new Date(todayStr() + 'T12:00:00'), b = new Date(s + 'T12:00:00');
  return Math.round((b - a) / 86400000);
}
function daysLabel(d) { return d === 0 ? 'امروز' : d === 1 ? 'فردا' : fa(d) + ' روز دیگر'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pv(id) {
  const v = document.getElementById(id).value;
  document.getElementById('pv-' + id).textContent = v ? '📅 ' + showDate(v) : '';
}
function dateField(id, value) {
  return '<label class="meta">تاریخ (انتخاب‌گر ممکن است میلادی نشان دهد؛ معادل شمسی زیرش نوشته می‌شود)</label>' +
    '<input type="date" id="' + id + '" value="' + (value || '') + '" oninput="pv(\'' + id + '\')">' +
    '<div class="meta" id="pv-' + id + '" style="margin-bottom:8px">' + (value ? '📅 ' + showDate(value) : '') + '</div>';
}

/* ============ وضعیت صفحه ============ */
let view = 'home';
let filter = 'open';
let sv = 'subjects';          // زیربخش مدرسه
let selDay = null;            // روز انتخاب‌شده در بخش پیشرفت
let range = 7;                // بازه‌ی نمودار: ۷ یا ۳۰ روز
let planDay = null, planForm = false, planStart = '', planScroll = false, noteSub = null;
let ed = null;                // {k:'task'|'asg'|'exam'|'sub', id}
const isEd = (k) => ed && ed.k === k;

const PRI = { high:['زیاد','p-high'], mid:['متوسط','p-mid'], low:['کم','p-low'] };
const PRI_ORDER = { high:0, mid:1, low:2 };
const COLORS = ['#3b6df0','#2a9d5c','#e07a1f','#a23bd1','#d93f3f','#0e9aa7','#c2a100','#6b7385'];

/* ============ هدر ============ */
function tick() {
  const now = new Date();
  document.getElementById('hd-date').textContent = pDate(now, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  document.getElementById('hd-time').textContent = new Intl.DateTimeFormat('fa-IR', { hour:'2-digit', minute:'2-digit' }).format(now);
}

/* ============ وظایف ============ */
function addOrUpdateTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('عنوان وظیفه را بنویسید.'); return; }
  const data = {
    title,
    priority: document.getElementById('f-pri').value,
    due: document.getElementById('f-due').value,
    minutes: parseInt(document.getElementById('f-min').value) || 0
  };
  if (isEd('task')) {
    const t = db.tasks.find(x => x.id === ed.id);
    if (t) Object.assign(t, data);
    ed = null;
  } else {
    db.tasks.push(Object.assign({ id: Date.now(), done:false, created: todayStr() }, data));
  }
  save(); render();
}
function toggleTask(id) {
  const t = db.tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; t.doneAt = t.done ? todayStr() : null; t.doneTime = t.done ? nowHM() : null; save(); render(); }
}
function deleteTask(id) {
  if (!confirm('این وظیفه حذف شود؟')) return;
  db.tasks = db.tasks.filter(x => x.id !== id); save(); render();
}
function editTask(id) { ed = { k:'task', id }; view = 'tasks'; render(); window.scrollTo(0,0); }
function setFilter(f) { filter = f; render(); }
function cancelEdit() { ed = null; planForm = false; render(); }

/* ============ درس‌ها ============ */
function getSub(id) { return db.subjects.find(s => s.id === id); }
function subTag(id) {
  const s = getSub(id);
  return s ? '<span class="tag" style="background:' + s.color + '22;color:' + s.color + '">' + esc(s.name) + '</span>' : '';
}
function saveSubject() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) { alert('نام درس را بنویسید.'); return; }
  if (isEd('sub')) {
    const s = getSub(ed.id); if (s) s.name = name; ed = null;
  } else {
    db.subjects.push({ id: Date.now(), name, color: COLORS[db.subjects.length % COLORS.length] });
  }
  save(); render();
}
function editSubject(id) { ed = { k:'sub', id }; render(); window.scrollTo(0,0); }
function deleteSubject(id) {
  const na = db.assignments.filter(a => a.subjectId === id).length;
  const ne = db.exams.filter(x => x.subjectId === id).length;
  const nn = db.notes.filter(x => x.subjectId === id).length;
  let msg = 'این درس حذف شود؟';
  if (na || ne || nn) msg += '\nتوجه: ' + fa(na) + ' تکلیف، ' + fa(ne) + ' امتحان و ' + fa(nn) + ' جزوه‌ی مربوط به این درس هم حذف می‌شود.';
  if (!confirm(msg)) return;
  db.subjects = db.subjects.filter(s => s.id !== id);
  db.assignments = db.assignments.filter(a => a.subjectId !== id);
  db.exams = db.exams.filter(x => x.subjectId !== id);
  db.notes.filter(x => x.subjectId === id).forEach(x => idbDel(x.id).catch(() => {}));
  db.notes = db.notes.filter(x => x.subjectId !== id);
  if (noteSub === id) noteSub = null;
  save(); render();
}

/* ============ تکالیف ============ */
function saveAsg() {
  const title = document.getElementById('a-title').value.trim();
  const subjectId = parseInt(document.getElementById('a-sub').value);
  if (!title) { alert('عنوان تکلیف را بنویسید.'); return; }
  const data = { title, subjectId, due: document.getElementById('a-due').value };
  if (isEd('asg')) {
    const a = db.assignments.find(x => x.id === ed.id); if (a) Object.assign(a, data); ed = null;
  } else {
    db.assignments.push(Object.assign({ id: Date.now(), done:false }, data));
  }
  save(); render();
}
function toggleAsg(id) {
  const a = db.assignments.find(x => x.id === id);
  if (a) { a.done = !a.done; a.doneAt = a.done ? todayStr() : null; a.doneTime = a.done ? nowHM() : null; save(); render(); }
}
function deleteAsg(id) {
  if (!confirm('این تکلیف حذف شود؟')) return;
  db.assignments = db.assignments.filter(x => x.id !== id); save(); render();
}
function editAsg(id) { ed = { k:'asg', id }; sv = 'asg'; view = 'school'; render(); window.scrollTo(0,0); }

/* ============ امتحان‌ها ============ */
function saveExam() {
  const title = document.getElementById('e-title').value.trim() || 'امتحان';
  const subjectId = parseInt(document.getElementById('e-sub').value);
  const date = document.getElementById('e-date').value;
  if (!date) { alert('تاریخ امتحان را انتخاب کنید.'); return; }
  const data = { title, subjectId, date };
  if (isEd('exam')) {
    const x = db.exams.find(y => y.id === ed.id); if (x) Object.assign(x, data); ed = null;
  } else {
    db.exams.push(Object.assign({ id: Date.now() }, data));
  }
  save(); render();
}
function deleteExam(id) {
  if (!confirm('این امتحان حذف شود؟')) return;
  db.exams = db.exams.filter(x => x.id !== id); save(); render();
}
function editExam(id) { ed = { k:'exam', id }; sv = 'exam'; view = 'school'; render(); window.scrollTo(0,0); }

/* ============ عادت‌ها ============ */
const DAYS_FULL = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const DAYS_SHORT = ['ش','ی','د','س','چ','پ','ج'];
function addDays(s, n) {
  const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function wIdx(s) { return (new Date(s + 'T12:00:00').getDay() + 1) % 7; } // شنبه = ۰
function scheduled(h, s) { return h.type === 'weekly' || h.days.includes(wIdx(s)); }
function weekCount(h) {
  const t = todayStr(), start = addDays(t, -wIdx(t));
  let c = 0;
  for (let i = 0; i < 7; i++) if (h.log[addDays(start, i)]) c++;
  return c;
}
function streaks(h) {
  const t = todayStr();
  let cur = 0, d = t;
  if (scheduled(h, d) && !h.log[d]) d = addDays(d, -1); // امروز هنوز فرصت دارید
  for (let i = 0; i < 3650 && d >= h.created; i++) {
    if (h.log[d]) { cur++; }
    else if (scheduled(h, d)) break;
    d = addDays(d, -1);
  }
  let best = 0, run = 0;
  for (let x = h.created; x <= t; x = addDays(x, 1)) {
    if (h.log[x]) { run++; if (run > best) best = run; }
    else if (scheduled(h, x) && x !== t) run = 0;
  }
  return { cur, best: Math.max(best, cur) };
}
function toggleHabit(id) {
  const h = db.habits.find(x => x.id === id); if (!h) return;
  const t = todayStr();
  if (h.log[t]) { delete h.log[t]; if (h.logTime) delete h.logTime[t]; } else { h.log[t] = true; (h.logTime = h.logTime || {})[t] = nowHM(); }
  save(); render();
}
function hType() {
  const w = document.getElementById('h-type').value === 'weekly';
  document.getElementById('h-daysbox').style.display = w ? 'none' : 'flex';
  document.getElementById('h-tbox').style.display = w ? 'block' : 'none';
}
function saveHabit() {
  const name = document.getElementById('h-name').value.trim();
  if (!name) { alert('نام عادت را بنویسید.'); return; }
  const type = document.getElementById('h-type').value;
  const days = Array.from(document.querySelectorAll('.hday:checked')).map(c => parseInt(c.value));
  const target = Math.min(7, Math.max(1, parseInt(document.getElementById('h-target').value) || 3));
  if (type === 'daily' && !days.length) { alert('حداقل یک روز هفته را انتخاب کنید.'); return; }
  const data = { name, type, days, target };
  if (isEd('habit')) {
    const h = db.habits.find(x => x.id === ed.id); if (h) Object.assign(h, data); ed = null;
  } else {
    db.habits.push(Object.assign({ id: Date.now(), created: todayStr(), log: {} }, data));
  }
  save(); render();
}
function editHabit(id) { ed = { k:'habit', id }; view = 'habits'; render(); window.scrollTo(0,0); }
function deleteHabit(id) {
  const h = db.habits.find(x => x.id === id);
  const n = h ? Object.keys(h.log).length : 0;
  if (!confirm('این عادت حذف شود؟' + (n ? '\nسابقه‌ی ' + fa(n) + ' بار انجام آن هم پاک می‌شود.' : ''))) return;
  db.habits = db.habits.filter(x => x.id !== id); save(); render();
}
function habitHTML(h) {
  const t = todayStr(), done = !!h.log[t];
  const info = h.type === 'weekly' ? fa(h.target) + ' بار در هفته'
    : (h.days.length === 7 ? 'هر روز' : h.days.map(i => DAYS_FULL[i]).join('، '));
  let status;
  if (h.type === 'weekly') {
    const c = weekCount(h);
    status = 'این هفته: ' + fa(c) + ' از ' + fa(h.target) + (c >= h.target ? ' ✅' : '');
  } else {
    const s = streaks(h);
    const medal = s.cur >= 100 ? ' 🏆' : s.cur >= 30 ? ' 🥇' : s.cur >= 7 ? ' 🏅' : '';
    status = s.cur > 0 ? '🔥 ' + fa(s.cur) + ' روز پیاپی' + medal : 'هر روز یک شروع تازه است 🌱';
    if (s.best > s.cur) status += ' • بهترین: ' + fa(s.best);
  }
  let wk = '<div class="week">';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i);
    const sym = h.log[d] ? '<b class="y">●</b>' : scheduled(h, d) ? '<b>○</b>' : '<b>·</b>';
    wk += '<div>' + sym + DAYS_SHORT[wIdx(d)] + '</div>';
  }
  wk += '</div>';
  return '<div class="task ' + (done ? 'done' : '') + '">' +
    '<input type="checkbox" ' + (done ? 'checked' : '') + ' onchange="toggleHabit(' + h.id + ')">' +
    '<div class="body"><div class="title">' + esc(h.name) + '</div>' +
    '<div class="meta">' + info + '</div><div class="meta">' + status + '</div>' + wk + '</div>' +
    '<button class="ed" onclick="editHabit(' + h.id + ')">ویرایش</button>' +
    '<button class="del" onclick="deleteHabit(' + h.id + ')">حذف</button></div>';
}
function renderHabits() {
  const e = isEd('habit') ? db.habits.find(x => x.id === ed.id) : null;
  const type = e ? e.type : 'daily';

/* ============ پیشرفت و گزارش ============ */
function dayCounts(d) {
  const tk = db.tasks.filter(t => t.done && t.doneAt === d);
  const as = db.assignments.filter(a => a.done && a.doneAt === d);
  const hb = db.habits.filter(h => h.log[d]);
  return { tk, as, hb, work: tk.length + as.length, habits: hb.length };
}
function lastDays(n) {
  const t = todayStr(), out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(t, -i));
  return out;
}
function goDay(d) { selDay = d; view = 'progress'; ed = null; render(); window.scrollTo(0, 0); }
function setRange(n) { range = n; render(); }
function undoHabit(id, d) {
  const h = db.habits.find(x => x.id === id);
  if (h) { delete h.log[d]; if (h.logTime) delete h.logTime[d]; save(); render(); }
}
function chartHTML(n) {
  const days = lastDays(n);
  const counts = days.map(dayCounts);
  const max = Math.max(1, ...counts.map(c => c.work + c.habits));
  return '<div class="chart">' + days.map((d, i) => {
    const c = counts[i], total = c.work + c.habits;
    const dn = pDate(new Date(d + 'T12:00:00'), { day:'numeric' });
    let lb = '';
    if (n <= 7) lb = DAYS_SHORT[wIdx(d)] + '<br>' + dn;
    else if ((n - 1 - i) % 5 === 0) lb = dn;
    return '<button class="col' + (d === selDay ? ' sel' : '') + '" onclick="goDay(\'' + d + '\')">' +
      '<span class="num">' + (total ? fa(total) : '') + '</span>' +
      '<span class="stack"><i class="h" style="height:' + (c.habits / max * 100) + '%"></i><i class="w" style="height:' + (c.work / max * 100) + '%"></i></span>' +
      '<span class="lb">' + lb + '</span></button>';
  }).join('') + '</div>';
}
function dayDetailHTML(d) {
  const c = dayCounts(d), t = todayStr();
  const title = pDate(new Date(d + 'T12:00:00'), { weekday:'long', day:'numeric', month:'long' }) + (d === t ? ' (امروز)' : '');
  let h = '<div class="card"><h2>کارهای انجام‌شده — ' + title + '</h2>';
  if (!c.work && !c.habits) return h + '<div class="empty">در این روز موردی ثبت نشده.</div></div>';
  c.tk.forEach(x => h += '<div class="task"><div class="body"><div class="title">' + esc(x.title) + '</div><div class="meta"><span class="tag k-task">وظیفه</span>' + (x.minutes ? fa(x.minutes) + ' دقیقه' : '') + '</div></div><button class="ed" onclick="toggleTask(' + x.id + ')">بازگردانی</button></div>');
  c.as.forEach(x => h += '<div class="task"><div class="body"><div class="title">' + esc(x.title) + '</div><div class="meta"><span class="tag k-asg">تکلیف</span>' + subTag(x.subjectId) + '</div></div><button class="ed" onclick="toggleAsg(' + x.id + ')">بازگردانی</button></div>');
  c.hb.forEach(x => h += '<div class="task"><div class="body"><div class="title">' + esc(x.name) + '</div><div class="meta"><span class="tag p-low">عادت</span></div></div><button class="ed" onclick="undoHabit(' + x.id + ',\'' + d + '\')">بازگردانی</button></div>');

function renderProgress() {

    '<div class="row"><button onclick="exportData()">دریافت فایل پشتیبان</button>' +

  return h;
}

/* ============ فایل‌ها (IndexedDB) برای جزوه‌ها ============ */
let idbp = null;
function idb() {
  if (!idbp) idbp = new Promise((res, rej) => {
    const r = indexedDB.open('lifeos_files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('imgs');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return idbp;
}
function idbPut(k, v) { return idb().then(d => new Promise((res, rej) => { const tx = d.transaction('imgs', 'readwrite'); tx.objectStore('imgs').put(v, String(k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); })); }
function idbGet(k) { return idb().then(d => new Promise((res, rej) => { const q = d.transaction('imgs').objectStore('imgs').get(String(k)); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })); }
function idbDel(k) { return idb().then(d => new Promise((res, rej) => { const tx = d.transaction('imgs', 'readwrite'); tx.objectStore('imgs').delete(String(k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); })); }
function hydrateImgs() {
  document.querySelectorAll('img[data-nid]').forEach(img => {
    idbGet(img.getAttribute('data-nid')).then(u => { if (u) img.src = u; }).catch(() => {});
  });
}
function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 1800 / Math.max(img.width, img.height));
      const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('تصویر خوانده نشد')); };
    img.src = url;
  });
}
async function addNotes(input) {
  const files = Array.from(input.files || []); input.value = '';
  if (!files.length || !noteSub) return;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    try {
      const data = await compressImage(files[i]);
      const id = Date.now() + i;
      await idbPut(id, data);
      db.notes.push({ id, subjectId: noteSub, caption: '', created: todayStr() });
      ok++;
    } catch (e) { alert('یک تصویر ذخیره نشد: ' + e.message); }
  }
  if (ok) { save(); render(); }
}
function openImg(id) {
  const n = db.notes.find(x => x.id === id); if (!n) return;
  const lb = document.getElementById('lb');
  lb.innerHTML = '<div class="bar2"><button class="sec" onclick="closeImg()">بستن ✕</button><button class="sec" onclick="renameNote(' + id + ')">عنوان</button><button class="sec" style="color:var(--danger)" onclick="deleteNote(' + id + ')">حذف</button></div>' +
    '<div class="cap">' + esc(n.caption || '') + '</div><img data-nid="' + id + '">';
  lb.style.display = 'flex'; hydrateImgs();

/* ============ پشتیبان‌گیری (شامل جزوه‌ها) ============ */
async function exportData() {
  const images = {};
  try { for (const n of db.notes) { const v = await idbGet(n.id); if (v) images[n.id] = v; } } catch (e) { console.log(e); }
  db.lastBackup = todayStr(); save();
  const blob = new Blob([JSON.stringify(Object.assign({}, db, { images }))], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lifeos-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  render();
}
function importData(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tasks)) throw new Error('این فایل پشتیبان LifeOS نیست.');
      if (!confirm('داده‌های فعلی برنامه با محتوای این فایل جایگزین می‌شود. ادامه می‌دهید؟')) return;
      const images = d.images || {}; delete d.images;
      db = Object.assign({ tasks: [], subjects: [], assignments: [], exams: [], habits: [], blocks: [], notes: [] }, d);
      for (const k of Object.keys(images)) await idbPut(k, images[k]);
      save(); render(); alert('بازیابی انجام شد.');
    } catch (e) { alert('بازیابی انجام نشد: ' + e.message); }
  };
  r.readAsText(f);
}

/* ============ برنامه‌ی روز ============ */
const HH = 52;
const CATS = { study:['درس','#3b6df0'], sport:['ورزش','#2a9d5c'], rest:['استراحت','#a23bd1'], work:['مسئولیت و کار','#e07a1f'], other:['سایر','#6b7385'] };
const faStr = (x) => String(x).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
function toMin(t) { const p = t.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]); }
function nowHM() { const n = new Date(); return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); }
function addMin(t, n) { const m = Math.min(1439, toMin(t) + n); return String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0'); }
function fmtDur(m) {
  const h = Math.floor(m / 60), r = m % 60;
  return (h ? fa(h) + ' ساعت' : '') + (h && r ? ' و ' : '') + (r ? fa(r) + ' دقیقه' : '') || '۰';
}
function autoDone(d) {
  const out = [];
  db.tasks.filter(t => t.done && t.doneAt === d).forEach(t => out.push({ icon:'✅', title:t.title, time:t.doneTime || '' }));
  db.assignments.filter(a => a.done && a.doneAt === d).forEach(a => out.push({ icon:'📚', title:a.title, time:a.doneTime || '' }));
  db.habits.filter(h => h.log[d]).forEach(h => out.push({ icon:'🔁', title:h.name, time:(h.logTime && h.logTime[d]) || '' }));
  return out;
}
function layoutItems(items) {
  items.sort((a, b) => a.s - b.s || a.e - b.e);
  let cluster = [], cEnd = -1, cols = [];
  const flush = () => { cluster.forEach(i => i.n = cols.length); cluster = []; cols = []; cEnd = -1; };
  items.forEach(i => {
    if (cluster.length && i.s >= cEnd) flush();
    let c = cols.findIndex(end => end <= i.s);
    if (c < 0) { c = cols.length; cols.push(0); }
    cols[c] = i.e; i.c = c; cluster.push(i); cEnd = Math.max(cEnd, i.e);
  });
  flush();
}
function timelineHTML(d) {
  const items = [];
  db.blocks.filter(b => b.date === d).forEach(b => items.push({ kind:'blk', b, s:toMin(b.start), e:toMin(b.end) }));
  autoDone(d).filter(x => x.time).forEach(x => { const s = toMin(x.time); items.push({ kind:'auto', x, s, e:Math.min(1440, s + 25) }); });
  layoutItems(items);
  let h = '<div class="tl" id="tl" style="height:' + (24 * HH) + 'px">';
  for (let i = 0; i < 24; i++) {
    const hh = String(i).padStart(2, '0');
    h += '<div class="hr" style="top:' + (i * HH) + 'px" onclick="planAt(\'' + hh + ':00\')"><span>' + faStr(hh) + ':' + faStr('00') + '</span></div>';
  }
  h += '<div class="tla">';
  items.forEach(it => {
    const top = it.s * HH / 60, ht = Math.max(26, (it.e - it.s) * HH / 60 - 2);
    const st = 'top:' + top + 'px;height:' + ht + 'px;right:' + (it.c / it.n * 100) + '%;width:calc(' + (100 / it.n) + '% - 3px);';
    if (it.kind === 'blk') {
      const b = it.b, cat = CATS[b.cat] || CATS.other;
      h += '<div class="blk' + (b.planned ? ' pl' : '') + '" style="' + st + 'border-color:' + cat[1] + ';background:' + cat[1] + (b.planned ? '18' : '33') + '" onclick="editBlock(' + b.id + ')">' +
        '<b>' + esc(b.title) + '</b><small>' + faStr(b.start) + '–' + faStr(b.end) + (b.planned ? ' (برنامه)' : '') + '</small></div>';
    } else {
      h += '<div class="blk au" style="' + st + '"><b>' + it.x.icon + ' ' + esc(it.x.title) + '</b><small>' + faStr(it.x.time) + '</small></div>';
    }
  });
  h += '</div>';
  if (d === todayStr()) h += '<div class="nowl" style="top:' + (toMin(nowHM()) * HH / 60) + 'px"></div>';
  return h + '</div>';
}
function planMove(n) { planDay = n === 0 ? todayStr() : addDays(planDay, n); planForm = false; ed = null; planScroll = true; render(); }
function planAt(time) { ed = null; planForm = true; planStart = time; render(); window.scrollTo(0, 0); }

function renderPlan() {
  const t = todayStr(); if (!planDay) planDay = t;
  const blocks = db.blocks.filter(b => b.date === planDay);
  const dur = (list) => list.reduce((a, b) => a + toMin(b.end) - toMin(b.start), 0);
  const act = dur(blocks.filter(b => !b.planned)), pln = dur(blocks.filter(b => b.planned));
  const title = pDate(new Date(planDay + 'T12:00:00'), { weekday:'long', day:'numeric', month:'long', year:'numeric' }) + (planDay === t ? ' (امروز)' : '');

  let h = '<div class="card"><div class="row" style="justify-content:space-between">' +
    '<button class="sec" onclick="planMove(-1)">روز قبل</button><button class="sec" onclick="planMove(0)">امروز</button><button class="sec" onclick="planMove(1)">روز بعد</button></div>' +
    '<h2 style="margin:10px 0 4px">' + title + '</h2>' +
    '<div class="meta">ثبت‌شده (واقعی): ' + fmtDur(act) + ' • برنامه‌ریزی‌شده: ' + fmtDur(pln) + '</div></div>';

  if (planForm) {
    const e = isEd('blk') ? db.blocks.find(x => x.id === ed.id) : null;

    const en = e ? e.end : addMin(st, 30);
    const cat = e ? e.cat : 'study';
    const planned = e ? e.planned : planDay > t;
    h += '<div class="card"><h2>' + (e ? 'ویرایش فعالیت' : 'ثبت یا برنامه‌ریزی فعالیت') + '</h2>' +
      '<input type="text" id="b-title" placeholder="چه کاری؟ (مثلاً: مطالعه‌ی ریاضی)" value="' + (e ? esc(e.title) : '') + '">' +
      '<div class="row"><div style="flex:1"><label class="meta">شروع</label><input type="time" id="b-start" value="' + st + '"></div>' +
      '<div style="flex:1"><label class="meta">پایان</label><input type="time" id="b-end" value="' + en + '"></div></div>' +
      '<select id="b-cat" onchange="bCat()">' + Object.keys(CATS).map(k => '<option value="' + k + '"' + (cat === k ? ' selected' : '') + '>' + CATS[k][0] + '</option>').join('') + '</select>' +
      (db.subjects.length ? '<select id="b-sub" style="display:' + (cat === 'study' ? 'block' : 'none') + '"><option value="">درس (اختیاری)</option>' +
        db.subjects.map(s => '<option value="' + s.id + '"' + (e && e.subjectId === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select>' : '') +
      '<select id="b-planned"><option value="0"' + (!planned ? ' selected' : '') + '>انجام‌شده (ثبت واقعی)</option><option value="1"' + (planned ? ' selected' : '') + '>برنامه‌ریزی‌شده (هنوز انجام نشده)</option></select>' +
      '<div class="row"><button onclick="saveBlock()">' + (e ? 'ذخیره' : 'افزودن') + '</button><button class="sec" onclick="cancelEdit()">انصراف</button>' +
      (e ? '<button class="del" onclick="deleteBlock(' + e.id + ')">حذف</button>' : '') + '</div></div>';
  } else {
    h += '<div class="card"><button style="width:100%" onclick="planAt(\'\')">＋ ثبت یا برنامه‌ریزی فعالیت</button>' +
      '<div class="meta" style="margin-top:6px">روی هر ساعت از جدول هم بزنید تا از همان ساعت شروع شود. کارهای تیک‌خورده خودکار در جای خودشان می‌نشینند (خاکستری).</div></div>';
  }

  const due = [];
  db.tasks.filter(x => !x.done && x.due === planDay).forEach(x => due.push('✅ ' + esc(x.title)));
  db.assignments.filter(x => !x.done && x.due === planDay).forEach(x => due.push('📚 ' + esc(x.title)));
  db.exams.filter(x => x.date === planDay).forEach(x => due.push('📝 ' + esc(x.title)));
  const noTime = autoDone(planDay).filter(x => !x.time);
  if (due.length) h += '<div class="card"><h2>مهلت‌های این روز</h2>' + due.map(x => '<div class="meta" style="font-size:.9em;padding:3px 0">' + x + '</div>').join('') + '</div>';
  if (noTime.length) h += '<div class="card"><h2>انجام‌شده بدون ساعت ثبت‌شده</h2>' + noTime.map(x => '<div class="meta" style="font-size:.9em;padding:3px 0">' + x.icon + ' ' + esc(x.title) + '</div>').join('') + '</div>';

  h += '<div class="card" style="padding:8px">' + timelineHTML(planDay) + '</div>';
  return h;
}

/* ============ قطعات نمایش ============ */
function taskHTML(t) {
  const [pl, pc] = PRI[t.priority] || PRI.mid;
  let due = '';
  if (t.due) {
    const d = daysFromToday(t.due);
    if (!t.done && d < 0) due = '<span class="overdue">⚠ گذشته: ' + showDate(t.due) + '</span>';
    else if (d === 0) due = 'مهلت: امروز';
    else due = 'مهلت: ' + showDate(t.due);
  }
  const dur = t.minutes ? ' • ' + fa(t.minutes) + ' دقیقه' : '';
  return '<div class="task ' + (t.done ? 'done' : '') + '">' +
    '<input type="checkbox" ' + (t.done ? 'checked' : '') + ' onchange="toggleTask(' + t.id + ')">' +
    '<div class="body"><div class="title">' + esc(t.title) + '</div>' +
    '<div class="meta"><span class="tag ' + pc + '">' + pl + '</span>' + due + dur + '</div></div>' +
    '<button class="ed" onclick="editTask(' + t.id + ')">ویرایش</button>' +
    '<button class="del" onclick="deleteTask(' + t.id + ')">حذف</button></div>';
}
function asgHTML(a) {
  let due = '';
  if (a.due) {
    const d = daysFromToday(a.due);
    if (!a.done && d < 0) due = '<span class="overdue">⚠ گذشته: ' + showDate(a.due) + '</span>';
    else due = 'مهلت: ' + (d === 0 ? 'امروز' : showDate(a.due));
  }
  return '<div class="task ' + (a.done ? 'done' : '') + '">' +
    '<input type="checkbox" ' + (a.done ? 'checked' : '') + ' onchange="toggleAsg(' + a.id + ')">' +
    '<div class="body"><div class="title">' + esc(a.title) + '</div>' +
    '<div class="meta">' + subTag(a.subjectId) + due + '</div></div>' +
    '<button class="ed" onclick="editAsg(' + a.id + ')">ویرایش</button>' +
    '<button class="del" onclick="deleteAsg(' + a.id + ')">حذف</button></div>';
}
function examHTML(x) {
  const d = daysFromToday(x.date);
  const when = d < 0 ? '<span class="meta">برگزار شده</span>' : '<b>' + daysLabel(d) + '</b>';
  return '<div class="task"><div class="body"><div class="title">📝 ' + esc(x.title) + '</div>' +
    '<div class="meta">' + subTag(x.subjectId) + showDate(x.date) + ' • ' + when + '</div></div>' +
    '<button class="ed" onclick="editExam(' + x.id + ')">ویرایش</button>' +
    '<button class="del" onclick="deleteExam(' + x.id + ')">حذف</button></div>';
}
function sortTasks(list) {
  return list.slice().sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const da = a.due || '9999', dbb = b.due || '9999';
    if (da !== dbb) return da < dbb ? -1 : 1;
    return PRI_ORDER[a.priority] - PRI_ORDER[b.priority];
  });
}
function byDue(a, b) { return (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0; }

/* ============ داشبورد ============ */
function renderHome() {
  const today = todayStr();
  const openT = db.tasks.filter(t => !t.done);
  const openA = db.assignments.filter(a => !a.done);
  const overdue = openT.filter(t => t.due && t.due < today).length + openA.filter(a => a.due && a.due < today).length;
  const dueToday = openT.filter(t => t.due === today).length + openA.filter(a => a.due === today).length;
  const doneToday = db.tasks.filter(t => t.doneAt === today).length + db.assignments.filter(a => a.doneAt === today).length;
  const important = sortTasks(openT.filter(t => t.priority === 'high')).slice(0, 5);

  // فهرست یکپارچه‌ی مهلت‌ها
  let items = [];
  openT.filter(t => t.due && t.due >= today).forEach(t => items.push({ kind:'وظیفه', cls:'k-task', title:t.title, date:t.due }));
  openA.filter(a => a.due && a.due >= today).forEach(a => items.push({ kind:'تکلیف', cls:'k-asg', title:a.title, date:a.due, sub:a.subjectId }));
  db.exams.filter(x => x.date >= today).forEach(x => items.push({ kind:'امتحان', cls:'k-exam', title:x.title, date:x.date, sub:x.subjectId }));
  items.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  items = items.slice(0, 7);

  let h = '<div class="card"><h2>خلاصه‌ی امروز</h2><div class="stats">' +
    '<div class="stat"><b>' + fa(openT.length + openA.length) + '</b><span>کار باز</span></div>' +
    '<div class="stat" style="cursor:pointer" onclick="goDay(todayStr())"><b>' + fa(doneToday) + '</b><span>انجام‌شده امروز ›</span></div>' +
    '<div class="stat"><b>' + fa(dueToday) + '</b><span>مهلت امروز</span></div>' +
    '<div class="stat"><b style="color:' + (overdue ? 'var(--danger)' : 'inherit') + '">' + fa(overdue) + '</b><span>گذشته از مهلت</span></div></div></div>';
  h += '<div class="card"><div class="row"><button style="flex:1" onclick="go(\'tasks\')">＋ وظیفه</button><button class="sec" style="flex:1" onclick="go(\'plan\')">🕒 برنامه‌ی روز</button><button class="sec" style="flex:1" onclick="go(\'progress\')">📈 پیشرفت</button></div></div>';
  const tb = db.blocks.filter(b => b.date === todayStr()).sort((a, b) => toMin(a.start) - toMin(b.start));
  h += '<div class="card"><h2>برنامه‌ی امروز</h2>' + (tb.length ? tb.slice(0, 6).map(b => '<div class="task"><div class="body"><div class="title">' + esc(b.title) + '</div><div class="meta">' + faStr(b.start) + ' تا ' + faStr(b.end) + (b.planned ? ' • برنامه‌ریزی‌شده' : ' • ثبت‌شده') + '</div></div></div>').join('') : '<div class="empty">هنوز فعالیتی برای امروز ثبت نشده.</div>') +
    '<button class="sec" style="width:100%;margin-top:6px" onclick="go(\'plan\')">باز کردن برنامه‌ی روز</button></div>';
  h += '<div class="card"><h2>روند ۷ روز اخیر</h2>' + chartHTML(7) + '<div class="meta" style="margin-top:6px">روی هر روز بزنید تا کارهای انجام‌شده‌اش را ببینید.</div></div>';
  const hasData = db.tasks.length || db.subjects.length || db.habits.length || db.assignments.length;
  if (hasData && (!db.lastBackup || daysFromToday(db.lastBackup) < -7)) {
    h += '<div class="card"><div class="meta" style="margin-bottom:8px">💾 مدتی است از داده‌هایتان پشتیبان نگرفته‌اید.</div><button class="sec" onclick="view=\'progress\';render()">رفتن به پشتیبان‌گیری</button></div>';
  }

  h += '<div class="card"><h2>مهلت‌ها و امتحان‌های پیش‌رو</h2>' +
    (items.length ? items.map(i => {
      const d = daysFromToday(i.date);
      return '<div class="task"><div class="body"><div class="title">' + esc(i.title) + '</div><div class="meta">' +
        '<span class="tag ' + i.cls + '">' + i.kind + '</span>' + (i.sub ? subTag(i.sub) : '') +
        showDate(i.date) + ' • ' + daysLabel(d) + '</div></div></div>';
    }).join('') : '<div class="empty">مهلت نزدیکی ثبت نشده.</div>') + '</div>';

  const tH = todayStr();
  const todays = db.habits.filter(x => scheduled(x, tH));
  const hDone = todays.filter(x => x.log[tH]).length;
  const hPct = todays.length ? Math.round(hDone / todays.length * 100) : 0;
  h += '<div class="card"><h2>عادت‌های امروز</h2>' + (todays.length ?
    '<div class="meta">' + fa(hDone) + ' از ' + fa(todays.length) + ' انجام شده</div><div class="bar" style="margin-bottom:6px"><i style="width:' + hPct + '%"></i></div>' +
    todays.map(x => '<div class="task ' + (x.log[tH] ? 'done' : '') + '"><input type="checkbox" ' + (x.log[tH] ? 'checked' : '') + ' onchange="toggleHabit(' + x.id + ')">' +
      '<div class="body"><div class="title">' + esc(x.name) + '</div>' +
      (x.type === 'weekly' ? '<div class="meta">این هفته: ' + fa(weekCount(x)) + ' از ' + fa(x.target) + '</div>' : '') + '</div></div>').join('')
    : '<div class="empty">برای امروز عادتی برنامه‌ریزی نشده.</div>') + '</div>';

  h += '<div class="card"><h2>کارهای مهم</h2>' +
    (important.length ? important.map(taskHTML).join('') : '<div class="empty">وظیفه‌ی مهمی ندارید 🎉</div>') + '</div>';
  return h;
}

/* ============ وظایف ============ */
function renderTasks() {
  const e = isEd('task') ? db.tasks.find(x => x.id === ed.id) : null;
  let h = '<div class="card"><h2>' + (e ? 'ویرایش وظیفه' : 'وظیفه‌ی جدید') + '</h2>' +
    '<input type="text" id="f-title" placeholder="عنوان وظیفه" value="' + (e ? esc(e.title) : '') + '">' +
    '<select id="f-pri">' +
      ['high','mid','low'].map(k => '<option value="' + k + '"' + ((e ? e.priority : 'mid') === k ? ' selected' : '') + '>اولویت: ' + PRI[k][0] + '</option>').join('') +
    '</select>' +
    dateField('f-due', e ? e.due : '') +
    '<input type="number" id="f-min" placeholder="زمان تخمینی (دقیقه)" min="0" value="' + (e && e.minutes ? e.minutes : '') + '">' +
    '<div class="row"><button onclick="addOrUpdateTask()">' + (e ? 'ذخیره‌ی تغییرات' : 'افزودن') + '</button>' +
    (e ? '<button class="sec" onclick="cancelEdit()">انصراف</button>' : '') + '</div></div>';

  const today = todayStr();
  let list = db.tasks;
  if (filter === 'open') list = list.filter(t => !t.done);
  else if (filter === 'done') list = list.filter(t => t.done);
  else if (filter === 'overdue') list = list.filter(t => !t.done && t.due && t.due < today);
  const names = { open:'باز', overdue:'گذشته', done:'انجام‌شده', all:'همه' };
  h += '<div class="card"><div class="filters">' +
    Object.keys(names).map(k => '<button class="sec ' + (filter === k ? 'active' : '') + '" onclick="setFilter(\'' + k + '\')">' + names[k] + '</button>').join('') +
    '</div>' + (list.length ? sortTasks(list).map(taskHTML).join('') : '<div class="empty">موردی نیست.</div>') + '</div>';
  return h;
}

/* ============ مدرسه ============ */
function subjectSelect(id, selected) {
  return '<select id="' + id + '">' + db.subjects.map(s =>
    '<option value="' + s.id + '"' + (s.id === selected ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select>';
}
function renderSchool() {
  const tabs = { subjects:'درس‌ها', asg:'تکالیف', exam:'امتحان‌ها' };
  let h = '<div class="card"><div class="filters" style="margin:0">' +
    Object.keys(tabs).map(k => '<button class="sec ' + (sv === k ? 'active' : '') + '" onclick="sv=\'' + k + '\';ed=null;render()">' + tabs[k] + '</button>').join('') + '</div></div>';

  if (sv === 'subjects') {
    const e = isEd('sub') ? getSub(ed.id) : null;
    h += '<div class="card"><h2>' + (e ? 'ویرایش درس' : 'درس جدید') + '</h2>' +
      '<input type="text" id="s-name" placeholder="مثلاً: ریاضی" value="' + (e ? esc(e.name) : '') + '">' +
      '<div class="row"><button onclick="saveSubject()">' + (e ? 'ذخیره' : 'افزودن درس') + '</button>' +
      (e ? '<button class="sec" onclick="cancelEdit()">انصراف</button>' : '') + '</div></div>';
    if (noteSub) h += notesPanel();
    h += '<div class="card"><h2>درس‌های من</h2>' + (db.subjects.length ? db.subjects.map(s => {
      const all = db.assignments.filter(a => a.subjectId === s.id);
      const done = all.filter(a => a.done).length;
      const pct = all.length ? Math.round(done / all.length * 100) : 0;
      return '<div class="task"><span class="dot" style="background:' + s.color + '"></span>' +
        '<div class="body"><div class="title">' + esc(s.name) + '</div>' +
        '<div class="meta">تکالیف انجام‌شده: ' + fa(done) + ' از ' + fa(all.length) + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<button class="sec" style="padding:4px 10px;margin-top:8px;font-size:.8em" onclick="noteSub=' + s.id + ';render()">📎 جزوه‌ها (' + fa(db.notes.filter(n => n.subjectId === s.id).length) + ')</button></div>' +
        '<button class="ed" onclick="editSubject(' + s.id + ')">ویرایش</button>' +
        '<button class="del" onclick="deleteSubject(' + s.id + ')">حذف</button></div>';
    }).join('') : '<div class="empty">هنوز درسی اضافه نکرده‌اید.</div>') + '</div>';
  } else if (!db.subjects.length) {
    h += '<div class="card empty">ابتدا از تب «درس‌ها» یک درس بسازید.</div>';
  } else if (sv === 'asg') {
    const e = isEd('asg') ? db.assignments.find(x => x.id === ed.id) : null;
    h += '<div class="card"><h2>' + (e ? 'ویرایش تکلیف' : 'تکلیف جدید') + '</h2>' +
      subjectSelect('a-sub', e ? e.subjectId : db.subjects[0].id) +
      '<input type="text" id="a-title" placeholder="عنوان تکلیف" value="' + (e ? esc(e.title) : '') + '">' +
      dateField('a-due', e ? e.due : '') +
      '<div class="row"><button onclick="saveAsg()">' + (e ? 'ذخیره‌ی تغییرات' : 'افزودن') + '</button>' +
      (e ? '<button class="sec" onclick="cancelEdit()">انصراف</button>' : '') + '</div></div>';
    const list = db.assignments.slice().sort((a, b) => (a.done !== b.done) ? (a.done ? 1 : -1) : byDue(a, b));
    h += '<div class="card"><h2>تکالیف</h2>' + (list.length ? list.map(asgHTML).join('') : '<div class="empty">تکلیفی ثبت نشده.</div>') + '</div>';
  } else {
    const e = isEd('exam') ? db.exams.find(x => x.id === ed.id) : null;
    h += '<div class="card"><h2>' + (e ? 'ویرایش امتحان' : 'امتحان جدید') + '</h2>' +
      subjectSelect('e-sub', e ? e.subjectId : db.subjects[0].id) +
      '<input type="text" id="e-title" placeholder="عنوان (مثلاً: میان‌ترم)" value="' + (e ? esc(e.title) : '') + '">' +
      dateField('e-date', e ? e.date : '') +
      '<div class="row"><button onclick="saveExam()">' + (e ? 'ذخیره‌ی تغییرات' : 'افزودن') + '</button>' +
      (e ? '<button class="sec" onclick="cancelEdit()">انصراف</button>' : '') + '</div></div>';
    const list = db.exams.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    h += '<div class="card"><h2>امتحان‌ها</h2>' + (list.length ? list.map(examHTML).join('') : '<div class="empty">امتحانی ثبت نشده.</div>') + '</div>';
  }
  return h;
}

function renderSoon(title) {
  return '<div class="card soon"><h2>' + title + '</h2>این بخش در گام‌های بعدی ساخته می‌شود.</div>';
}

function render() {
  const app = document.getElementById('app');
  if (view === 'home') app.innerHTML = renderHome();
  else if (view === 'tasks') app.innerHTML = renderTasks();
  else if (view === 'school') app.innerHTML = renderSchool();
  else if (view === 'plan') app.innerHTML = renderPlan();
  else if (view === 'habits') app.innerHTML = renderHabits();
  else app.innerHTML = renderProgress();
  const TITLES = { home:'داشبورد', tasks:'وظایف', plan:'برنامه‌ی روز', school:'مدرسه', habits:'عادت‌ها', progress:'پیشرفت' };
  document.getElementById('hd-title').textContent = TITLES[view] || 'LifeOS';
  hydrateImgs();
  if (view === 'plan' && planScroll) {
    planScroll = false;
    const el = document.getElementById('tl');
    if (el) {
      const mins = planDay === todayStr() ? toMin(nowHM()) : 7 * 60;
      window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY + mins * HH / 60 - 220);
    }
  }
}


load(); tick(); setInterval(tick, 30000); render();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('SW', e); }); }
</script>
</body>
